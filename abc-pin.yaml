# vyges-abc-lib — the ABC build this crate links. MODULE.bazel is what Bazel reads; this file is the
# record of WHAT was pinned and WHY, for the provenance manifest and for a deliberate bump.
#
# ⛔ Bump deliberately (manual), never to "latest". ABC's synthesis and proof engines make choices
# that depend on its exact source, compiler and floating-point flags.
abc:
  module: "0.64-yosyshq.bcr.2"   # Bazel Central Registry module `abc` (YosysHQ's ABC fork)
  options:
    use_readline: false          # no GNU readline in the archive (.bazelrc)
    defines: [ABC_USE_CUDD=1, ABC_USE_PTHREADS, ABC_NAMESPACE=abc, ABC_USE_STDINT_H=1]  # the module's own
  patches: []                    # none; see README "Pin" for the one deliberately left out
transitive:
  bazel_skylib: "1.8.2"
  platforms: "1.0.0"
  rules_license: "1.0.0"
  zlib: "1.3.1.bcr.7"
toolchain:
  bazel: "9.1.1"                 # .bazelversion
  llvm:  "0.8.18"                # hermetic LLVM Bazel module: the compiler is part of the pin
  flags: ["-c opt", "-O3", "-ffp-contract=off", "-stdlib=libc++ (ABC sources)"]
license:
  abc: BSD-3-Clause              # copyright.txt, The Regents of the University of California
  zlib: Zlib
